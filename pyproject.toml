[project]
name = "ai-outage-concierge"
version = "0.1.0"
description = "HackOHI/O 2026 AEP challenge: AI Outage Concierge"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.170.9",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
    "realdata: runs against the real files in data/ (needs CONCIERGE_TOKEN_SALT; slow)",
]
