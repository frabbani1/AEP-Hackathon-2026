schema: spec-driven

context: |
  Project: HackOHI/O 2026 - AEP AI Outage Concierge.

  Goal:
  Build an AWS-native web application that predicts
  outage risk, estimates restoration duration, explains
  predictions, provides preparation guidance, and
  generates proactive customer communications.

  Data:
  - All provided datasets are in /data at repo root.
  - Inspect actual files and schemas before designing models.
  - Do not assume every challenge-described field exists.
  - Preserve original datasets.
  - Avoid exposing sensitive or internal-only data.

  Architecture:
  - Frontend: React, TypeScript, Vite
  - Hosting: AWS Amplify
  - API: Amazon API Gateway HTTP API
  - Backend: Python AWS Lambda
  - AI: Amazon Bedrock
  - Geospatial: GeoPandas, MapLibre, Amazon Location
  - Graph processing: NetworkX
  - Storage: Amazon S3
  - Persistence: DynamoDB only when necessary
  - Infrastructure: AWS CDK (TypeScript)

  Constraints:
  - AWS budget: $100-$300
  - Prefer serverless, pay-per-use infrastructure.
  - Separate predictive calculations from generative AI.
  - Make model assumptions and uncertainty explicit.
  - Prioritize a working hackathon demonstration.
  - Do not deploy cloud resources without review.

rules:
  proposal:
    - Define scope and exclusions.
    - Explain the customer-visible outcome.
  design:
    - Document API contracts and data dependencies.
    - Identify privacy and operational limitations.
  tasks:
    - Use small, testable implementation steps.
    - Include validation and integration tests.