[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aep-pipeline"
version = "0.1.0"
description = "Offline curation pipeline for the AEP AI Outage Concierge challenge data"
requires-python = ">=3.12,<3.13"
dependencies = [
  "geopandas==1.0.1",
  "networkx==3.4.2",
  "numpy==2.5.4",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "pyarrow==19.0.1",
  "pyogrio==0.10.0",
  "pyproj==3.7.1",
  "pyyaml==6.0.3",
  "shapely==2.0.7",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:Field .* create as date field, though DateTime requested.:RuntimeWarning",
]
markers = [
  "real_data: reads the real files under data/ (skipped when they are absent or are LFS pointers)",
]
