<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 915" width="1200" height="915" font-family="-apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AI Outage Concierge architecture</title>
  <desc id="d">Build-time pipeline produces artifacts. A single handler and service call deterministic engines and a guarded text layer. A React frontend calls the handler through /api. The deployed shape uses CloudFront, API Gateway, Lambda, DynamoDB, S3 and Bedrock.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .grp { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; }
      .gt { font-size: 15px; font-weight: 700; fill: #111827; }
      .box { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
      .eng { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
      .llm { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
      .web { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
      .art { fill: #fefce8; stroke: #a16207; stroke-width: 1.5; }
      .bt { font-size: 14px; font-weight: 700; fill: #111827; }
      .st { font-size: 12px; fill: #374151; }
      .ln { stroke: #374151; stroke-width: 1.8; fill: none; }
      .dash { stroke: #374151; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
      .lbl { font-size: 11.5px; fill: #374151; font-style: italic; }
    </style>
  </defs>

  <rect width="1200" height="915" fill="#ffffff"/>

  <!-- ============ BUILD TIME ============ -->
  <rect class="grp" x="20" y="20" width="1160" height="130" rx="10"/>
  <text class="gt" x="36" y="44">Build time (offline, run once)</text>

  <rect class="box" x="40" y="62" width="200" height="72" rx="8"/>
  <text class="bt" x="140" y="88" text-anchor="middle">data/</text>
  <text class="st" x="140" y="106" text-anchor="middle">shapefiles, topology txt,</text>
  <text class="st" x="140" y="121" text-anchor="middle">labor workbook (read-only)</text>

  <rect class="box" x="270" y="62" width="200" height="72" rx="8"/>
  <text class="bt" x="370" y="88" text-anchor="middle">scripts/curate.py</text>
  <text class="st" x="370" y="106" text-anchor="middle">clean tables, salted tokens,</text>
  <text class="st" x="370" y="121" text-anchor="middle">groups under 10 suppressed</text>

  <rect class="box" x="500" y="62" width="200" height="72" rx="8"/>
  <text class="bt" x="600" y="88" text-anchor="middle">build_risk_artifacts.py</text>
  <text class="st" x="600" y="106" text-anchor="middle">risk rows, calibration,</text>
  <text class="st" x="600" y="121" text-anchor="middle">restoration tree, 57 areas</text>

  <rect class="art" x="730" y="62" width="230" height="72" rx="8"/>
  <text class="bt" x="845" y="88" text-anchor="middle">artifacts/</text>
  <text class="st" x="845" y="106" text-anchor="middle">premise_risk.jsonl, calibration.json,</text>
  <text class="st" x="845" y="121" text-anchor="middle">restoration_tree.json, zones.json</text>

  <rect class="box" x="990" y="62" width="170" height="72" rx="8"/>
  <text class="bt" x="1075" y="88" text-anchor="middle">run_backtest.py</text>
  <text class="st" x="1075" y="106" text-anchor="middle">fit Sep 2024, test Feb 2025</text>
  <text class="st" x="1075" y="121" text-anchor="middle">writes backtest.json</text>

  <line class="ln" x1="240" y1="98" x2="268" y2="98" marker-end="url(#arrow)"/>
  <line class="ln" x1="470" y1="98" x2="498" y2="98" marker-end="url(#arrow)"/>
  <line class="ln" x1="700" y1="98" x2="728" y2="98" marker-end="url(#arrow)"/>
  <line class="ln" x1="990" y1="98" x2="962" y2="98" marker-end="url(#arrow)"/>

  <!-- ============ FRONTEND ============ -->
  <rect class="grp" x="20" y="190" width="280" height="290" rx="10"/>
  <text class="gt" x="36" y="214">frontend/  React + TypeScript</text>

  <rect class="web" x="40" y="230" width="240" height="70" rx="8"/>
  <text class="bt" x="160" y="256" text-anchor="middle">api/httpClient.ts</text>
  <text class="st" x="160" y="274" text-anchor="middle">same-origin /api, snake_case</text>
  <text class="st" x="160" y="289" text-anchor="middle">to camelCase (Vite proxy in dev)</text>

  <rect class="web" x="40" y="315" width="240" height="60" rx="8"/>
  <text class="bt" x="160" y="341" text-anchor="middle">Pages</text>
  <text class="st" x="160" y="359" text-anchor="middle">chat /, map /map, /safety, /about</text>

  <rect class="web" x="40" y="390" width="240" height="75" rx="8"/>
  <text class="bt" x="160" y="414" text-anchor="middle">Map cards (Leaflet)</text>
  <text class="st" x="160" y="432" text-anchor="middle">risk, restoration + what-if, prepare,</text>
  <text class="st" x="160" y="447" text-anchor="middle">alerts, messages, transparency,</text>
  <text class="st" x="160" y="462" text-anchor="middle">evidence</text>

  <!-- ============ HANDLER ============ -->
  <rect class="grp" x="340" y="190" width="280" height="290" rx="10"/>
  <text class="gt" x="356" y="214">backend/concierge/api</text>

  <rect class="box" x="360" y="230" width="240" height="70" rx="8"/>
  <text class="bt" x="480" y="256" text-anchor="middle">handler.py (Lambda entry)</text>
  <text class="st" x="480" y="274" text-anchor="middle">route allowlist, 8 KB limit,</text>
  <text class="st" x="480" y="289" text-anchor="middle">clean errors. Also dev_api.py</text>

  <rect class="box" x="360" y="320" width="240" height="70" rx="8"/>
  <text class="bt" x="480" y="346" text-anchor="middle">service.py  Concierge</text>
  <text class="st" x="480" y="364" text-anchor="middle">validates input, calls the engines,</text>
  <text class="st" x="480" y="379" text-anchor="middle">assembles one response</text>

  <rect class="box" x="360" y="410" width="240" height="56" rx="8"/>
  <text class="bt" x="480" y="433" text-anchor="middle">store.py</text>
  <text class="st" x="480" y="452" text-anchor="middle">DynamoDB + S3, or artifacts/ locally</text>

  <line class="ln" x1="280" y1="265" x2="358" y2="265" marker-end="url(#arrow)"/>
  <line class="ln" x1="480" y1="300" x2="480" y2="318" marker-end="url(#arrow)"/>
  <line class="ln" x1="480" y1="390" x2="480" y2="408" marker-end="url(#arrow)"/>
  <!-- artifacts -> store (dashed, runs through the gap between the two groups) -->
  <path class="dash" d="M790 134 V168 H320 V438 H358" marker-end="url(#arrow)"/>
  <text class="lbl" x="560" y="162">loaded at startup</text>

  <!-- ============ ENGINES ============ -->
  <rect class="grp" x="660" y="190" width="520" height="290" rx="10"/>
  <text class="gt" x="676" y="214">Deterministic engines (compute every number)</text>

  <rect class="eng" x="680" y="230" width="230" height="65" rx="8"/>
  <text class="bt" x="795" y="254" text-anchor="middle">risk/</text>
  <text class="st" x="795" y="272" text-anchor="middle">band, confidence, top factors,</text>
  <text class="st" x="795" y="286" text-anchor="middle">fallback when data is thin</text>

  <rect class="eng" x="930" y="230" width="230" height="65" rx="8"/>
  <text class="bt" x="1045" y="254" text-anchor="middle">restoration/</text>
  <text class="st" x="1045" y="272" text-anchor="middle">seeded Monte Carlo over the tree,</text>
  <text class="st" x="1045" y="286" text-anchor="middle">P50 / P90 hours, step restoration</text>

  <rect class="eng" x="680" y="310" width="230" height="65" rx="8"/>
  <text class="bt" x="795" y="334" text-anchor="middle">guidance/</text>
  <text class="st" x="795" y="352" text-anchor="middle">hard-coded safety text first,</text>
  <text class="st" x="795" y="366" text-anchor="middle">then preparation items</text>

  <rect class="eng" x="930" y="310" width="230" height="65" rx="8"/>
  <text class="bt" x="1045" y="334" text-anchor="middle">alerts/</text>
  <text class="st" x="1045" y="352" text-anchor="middle">rules_table.json: tier, timing,</text>
  <text class="st" x="1045" y="366" text-anchor="middle">channels, escalation, audit entry</text>

  <rect class="eng" x="680" y="390" width="230" height="65" rx="8"/>
  <text class="bt" x="795" y="414" text-anchor="middle">zones/</text>
  <text class="st" x="795" y="432" text-anchor="middle">area lookup, city / ZIP find,</text>
  <text class="st" x="795" y="446" text-anchor="middle">shapes for the map</text>

  <rect class="eng" x="930" y="390" width="230" height="65" rx="8"/>
  <text class="bt" x="1045" y="414" text-anchor="middle">weather/</text>
  <text class="st" x="1045" y="432" text-anchor="middle">Open-Meteo wind gusts to storm</text>
  <text class="st" x="1045" y="446" text-anchor="middle">strength (optional)</text>

  <line class="ln" x1="600" y1="355" x2="658" y2="355" marker-end="url(#arrow)"/>

  <!-- ============ TEXT LAYER ============ -->
  <rect class="grp" x="660" y="500" width="520" height="175" rx="10"/>
  <text class="gt" x="1164" y="524" text-anchor="end">Text layer (explains only, never computes)</text>

  <rect class="llm" x="680" y="545" width="150" height="110" rx="8"/>
  <text class="bt" x="755" y="568" text-anchor="middle">messages/</text>
  <text class="bt" x="755" y="585" text-anchor="middle">assistant/</text>
  <text class="st" x="755" y="605" text-anchor="middle">fact card of</text>
  <text class="st" x="755" y="620" text-anchor="middle">whitelisted values,</text>
  <text class="st" x="755" y="635" text-anchor="middle">templates</text>

  <rect class="llm" x="855" y="545" width="140" height="110" rx="8"/>
  <text class="bt" x="925" y="568" text-anchor="middle">Bedrock</text>
  <text class="st" x="925" y="590" text-anchor="middle">optional, phrases</text>
  <text class="st" x="925" y="605" text-anchor="middle">the text only</text>
  <text class="st" x="925" y="625" text-anchor="middle">breaker + cache</text>

  <rect class="llm" x="1020" y="545" width="140" height="110" rx="8"/>
  <text class="bt" x="1090" y="568" text-anchor="middle">Guard</text>
  <text class="st" x="1090" y="590" text-anchor="middle">number not on the</text>
  <text class="st" x="1090" y="605" text-anchor="middle">card, or a rule</text>
  <text class="st" x="1090" y="620" text-anchor="middle">broken? Use the</text>
  <text class="st" x="1090" y="635" text-anchor="middle">template instead</text>

  <line class="ln" x1="755" y1="480" x2="755" y2="543" marker-end="url(#arrow)"/>
  <line class="ln" x1="830" y1="600" x2="853" y2="600" marker-end="url(#arrow)"/>
  <line class="ln" x1="995" y1="600" x2="1018" y2="600" marker-end="url(#arrow)"/>

  <!-- ============ DESIGN RULES ============ -->
  <rect class="grp" x="20" y="500" width="600" height="175" rx="10"/>
  <text class="gt" x="36" y="524">Design rules</text>
  <text class="st" x="40" y="552" font-size="13">1. Code computes every number. The model only phrases text from a fact card.</text>
  <text class="st" x="40" y="578" font-size="13">2. Safety text is hard-coded and placed by code. The model cannot change it.</text>
  <text class="st" x="40" y="604" font-size="13">3. Privacy at the edges: salted tokens, groups of 10+ homes, no identifiers in responses.</text>
  <text class="st" x="40" y="630" font-size="13">4. Rules are data (alert thresholds, calibration), not code branches.</text>
  <text class="st" x="40" y="656" font-size="13">5. Same handler runs in Lambda and locally. The API has no authentication (demo only).</text>

  <!-- ============ DEPLOYED SHAPE ============ -->
  <rect class="grp" x="20" y="695" width="1160" height="205" rx="10"/>
  <text class="gt" x="36" y="719">Deployed shape (infra/, AWS CDK)</text>

  <rect class="box" x="40" y="785" width="140" height="56" rx="8"/>
  <text class="bt" x="110" y="809" text-anchor="middle">CloudFront</text>
  <text class="st" x="110" y="827" text-anchor="middle">one public domain</text>

  <rect class="box" x="230" y="735" width="160" height="50" rx="8"/>
  <text class="bt" x="310" y="757" text-anchor="middle">S3 web bucket</text>
  <text class="st" x="310" y="774" text-anchor="middle">built frontend</text>

  <rect class="box" x="230" y="840" width="160" height="50" rx="8"/>
  <text class="bt" x="310" y="862" text-anchor="middle">API Gateway</text>
  <text class="st" x="310" y="879" text-anchor="middle">HTTP API, light throttle</text>

  <rect class="box" x="450" y="840" width="140" height="50" rx="8"/>
  <text class="bt" x="520" y="862" text-anchor="middle">Lambda</text>
  <text class="st" x="520" y="879" text-anchor="middle">Python 3.12</text>

  <rect class="box" x="660" y="735" width="190" height="50" rx="8"/>
  <text class="bt" x="755" y="757" text-anchor="middle">DynamoDB</text>
  <text class="st" x="755" y="774" text-anchor="middle">premise rows, demo alert sign-ups</text>

  <rect class="box" x="660" y="790" width="190" height="50" rx="8"/>
  <text class="bt" x="755" y="812" text-anchor="middle">S3 clean bucket</text>
  <text class="st" x="755" y="829" text-anchor="middle">serving/ and curated/ JSON</text>

  <rect class="box" x="660" y="845" width="190" height="50" rx="8"/>
  <text class="bt" x="755" y="867" text-anchor="middle">Bedrock (optional)</text>
  <text class="st" x="755" y="884" text-anchor="middle">phrases text, guarded</text>

  <!-- CloudFront to S3 web and to API Gateway -->
  <path class="ln" d="M180 813 H205 V760 H228" marker-end="url(#arrow)"/>
  <path class="ln" d="M205 813 V865 H228" marker-end="url(#arrow)"/>
  <text class="lbl" x="150" y="858" text-anchor="end">/api/*</text>
  <line class="ln" x1="390" y1="865" x2="448" y2="865" marker-end="url(#arrow)"/>

  <!-- Lambda to its three data sources -->
  <path class="ln" d="M590 865 H625 V765 H658" marker-end="url(#arrow)"/>
  <path class="ln" d="M625 815 H658" marker-end="url(#arrow)"/>
  <path class="dash" d="M625 865 H658" marker-end="url(#arrow)"/>

  <text class="st" x="890" y="760" font-size="12.5">The Lambda bundle holds the engines only.</text>
  <text class="st" x="890" y="782" font-size="12.5">Premise rows: one GetItem per request.</text>
  <text class="st" x="890" y="804" font-size="12.5">Calibration, labor and zones are read</text>
  <text class="st" x="890" y="820" font-size="12.5">from the clean bucket and cached.</text>
  <text class="st" x="890" y="842" font-size="12.5">Raw and clean buckets block public access.</text>
</svg>
